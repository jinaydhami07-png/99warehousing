---
# cPanel Git Version Control deployment.
#
# Without this file cPanel clones the repository and stops — the site would sit
# at public_html/deploy/public/index.html instead of at the web root, and every
# relative "assets/site.css" would resolve one level too deep.
#
# This copies the SITE ONLY (deploy/public) to the web root, so index.html and
# assets/ end up side by side, exactly as they are served locally.
#
# EDIT THE NEXT LINE: replace CPANELUSER with your cPanel account username.
# You can see it on the cPanel home page, top right, as "Current User".
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANELUSER/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R deploy/public/. $DEPLOYPATH/
    # server/ is deliberately NOT copied. It cannot run without Node, and
    # anything under public_html is served as plain text by Apache.
